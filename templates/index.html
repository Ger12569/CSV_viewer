<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSV/Excel Viewer</title>

    <style>
        body { font-family: Arial; margin: 40px; background: #f5f5f5; }
        .container { background: white; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #eee; }
        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; }
        .error { color: red; }
    </style>
</head>

<body>
<div class="container">

    <h1>CSV / Excel Viewer</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button class="btn" type="submit">Upload</button>
    </form>

    <hr>

    <!-- 🔥 ФИЛЬТР -->
    <form method="POST">
        <label>Column:</label>
        <input type="text" name="column" placeholder="e.g. age">

        <label>Greater than:</label>
        <input type="text" name="value" placeholder="e.g. 20">

        <button class="btn" type="submit">Filter</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if table %}
        <h2>Table</h2>
        {{ table | safe }}
    {% endif %}

</div>
</body>
</html>
